name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve Version Metadata (Obtainium-compatible)
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            IS_TAG="true"
          else
            TAG_NAME="sha-${SHORT_SHA}"
            VERSION_NAME="0.2.0-dev+${SHORT_SHA}"
            IS_TAG="false"
          fi

          if [[ "${TAG_NAME}" =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          # Monotonically increasing versionCode for seamless Obtainium in-place updates
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Decode Release Keystore (if configured)
        id: signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "keystore_file=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: gradle :core:model:test testDebugUnitTest

      - name: Build Signed Release APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}"

      - name: Build Debug APK (Fallback when Release Keystore is not set)
        if: steps.signing.outputs.has_keystore != 'true'
        run: |
          gradle assembleDebug \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}"

      - name: Package Obtainium-ready APK & Checksums
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          OUT_APK="dist/backspace-android-${{ steps.meta.outputs.tag_name }}.apk"
          cp "$SRC_APK" "$OUT_APK"
          (cd dist && sha256sum "$(basename "$OUT_APK")" > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backspace-android-${{ steps.meta.outputs.tag_name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (Obtainium)
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
